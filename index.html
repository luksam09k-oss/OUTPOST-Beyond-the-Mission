<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090c20">
  <title>OUTPOST · Beyond the Mission</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="art.js"></script>

<body>
  <main id="app"></main>
  <dialog id="help" aria-labelledby="help-title">
    <h2 id="help-title">Cómo jugar</h2>
    <p>Muévete con las flechas, WASD o los botones en pantalla. Acércate al objetivo marcado y pulsa <kbd>E</kbd> o «Interactuar».</p>
    <p>Completa cinco misiones. Cada decisión cambia la energía, los suministros o la seguridad de la tripulación.</p>
    <form method="dialog"><button class="primary">Entendido</button></form>
  </dialog>
</body>
