<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090c20">
  <title>OUTPOST · Beyond the Mission</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="opening.css">
  <link rel="stylesheet" href="credits.css">
  <script defer src="i18n.js"></script>
  <script defer src="opening.js"></script>
  <script defer src="art.js"></script>
  <link rel="stylesheet" href="ship.css">
  <link rel="stylesheet" href="mission.css">
  <script defer src="ship.js"></script>
  <link rel="stylesheet" href="viewport.css">
  <link rel="stylesheet" href="science.css">
  <script defer src="science.js"></script>
  <script defer src="moon-map.js"></script>
  <script defer src="science-ui.js"></script>
  <script defer src="solar.js"></script>
  <script defer src="solar-ui.js"></script>
  <link rel="stylesheet" href="mars.css">
  <script defer src="mars-science.js"></script>
  <script defer src="mars-data.js"></script>
  <script defer src="mars-info.js"></script>
  <script defer src="mars-ui.js"></script>
  <script defer src="game.js"></script>
</head>
<body>
  <main id="app"></main>
  <template id="opening-template">
    <section id="stage" aria-label="Pantalla de inicio" data-label-en="Start screen">
  <canvas id="c" width="320" height="180"></canvas>
  <div class="scan"></div><div class="vig"></div>

  <img class="badge" src="assets/nasa-space-apps.webp" alt="NASA Space Apps Challenge 2026">

  <div class="hero">
    <svg class="orb" viewBox="0 0 160 90" aria-hidden="true">
      <g transform="rotate(-6 80 31.5)">
        <path class="arc" pathLength="100" d="M140 31.5A60 13.5 0 1 1 20 31.5A60 13.5 0 1 1 140 31.5Z"/>
        <path class="arc b" pathLength="100" d="M146 31.5A66 17.5 0 1 1 14 31.5A66 17.5 0 1 1 146 31.5Z"/>
        <circle r="1.1" fill="#fff"><animateMotion dur="9s" repeatCount="indefinite" path="M140 31.5A60 13.5 0 1 1 20 31.5A60 13.5 0 1 1 140 31.5Z"/></circle>
      </g>
      <path class="spark" d="M139.7 21.2L140.7 24.2L143.7 25.2L140.7 26.2L139.7 29.2L138.7 26.2L135.7 25.2L138.7 24.2Z"/>
    </svg>
    <h1 class="logo" aria-label="OUTPOST">
      <span class="l1" aria-hidden="true">OUTPOST:</span><span class="l2" aria-hidden="true">OUTPOST:</span>
      <span class="l3" aria-hidden="true">OUTPOST:</span><span class="l4" aria-hidden="true">OUTPOST:</span>
    </h1>
    <p class="sub">Beyond the Mission</p>
  </div>
  <p class="tag" data-en="Every decision counts">Cada decisión cuenta</p>
  <button class="start" id="start"><em data-en="START MISSION">COMENZAR MISIÓN</em></button>

  <nav class="language-options" aria-label="Idioma / Language">
    <span class="language-label" aria-hidden="true" data-en="Language">Idioma</span>
    <a href="?lang=es" lang="es" hreflang="es">Español</a>
    <a href="?lang=en" lang="en" hreflang="en">English</a>
  </nav>
  <div class="hud" id="hud"></div>
  <div class="load"><b data-en="LOADING MISSION">CARGANDO MISIÓN</b><div class="bar"><i id="bar"></i></div><small data-en="Every decision counts">Cada decisión cuenta</small></div>
  <div class="wh" id="wh"></div>
    <div class="screen-credits">
      <div class="team-credit">
        <img src="assets/team-cinco.webp" width="480" height="302" alt="">
        <strong>CINCO</strong>
      </div>
      <div class="support-credit">
        <span data-en="With thanks to">Gran apoyo</span>
        <div class="support-logos">
          <img src="assets/credit-chatgpt.webp" width="128" height="128" alt="ChatGPT">
          <img src="assets/credit-claude.webp" width="128" height="128" alt="Claude">
          <img src="assets/credit-canva.webp" width="128" height="128" alt="Canva">
        </div>
      </div>
    </div>
    </section>
  </template>
  <dialog id="science-info" aria-labelledby="science-info-title"></dialog>
  <dialog id="help" aria-labelledby="help-title">
    <h2 id="help-title" data-en="How to play">Cómo jugar</h2>
    <p data-en="Use the arrows, WASD, or the on-screen buttons to move. Approach a character or a marked objective and press E or Interact.">Muévete con las flechas, WASD o los botones en pantalla. Acércate a un personaje o al objetivo marcado y pulsa <kbd>E</kbd> o «Interactuar».</p>
    <p data-en="Complete three missions. Each decision changes energy, oxygen, or accumulated radiation.">Completa tres misiones. Cada decisión cambia la energía, el oxígeno o la radiación acumulada.</p>
    <form method="dialog"><button class="primary" data-en="Got it">Entendido</button></form>
  </dialog>
</body>
</html>
