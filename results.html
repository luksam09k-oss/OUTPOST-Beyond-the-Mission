<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090c20">
  <title>OUTPOST · Informe lunar</title>
  <link rel="stylesheet" href="results.css">
  <link rel="stylesheet" href="credits.css">
  <script defer src="i18n.js"></script>
  <script defer src="results-scene.js"></script>
  <script defer src="results.js"></script>
</head>
<body>
  <main class="stage">
    <div class="world" id="world" aria-hidden="true">
      <img src="assets/lunar-finale.webp" alt="">
      <span class="suit-mark"></span>
      <canvas id="fx" width="836" height="470"></canvas>
    </div>
    <div class="vig" aria-hidden="true"></div>
    <div class="screen-credits">
      <div class="team-credit">
        <img src="assets/team-cinco.webp" width="480" height="302" alt="">
        <strong>CINCO</strong>
      </div>
      <div class="support-credit">
        <span data-en="With thanks to">Gran apoyo</span>
        <div class="support-logos">
          <img src="assets/credit-chatgpt.webp" width="128" height="128" alt="ChatGPT">
          <img src="assets/credit-claude.webp" width="128" height="128" alt="Claude">
          <img src="assets/credit-canva.webp" width="128" height="128" alt="Canva">
        </div>
      </div>
    </div>
    <article class="report" aria-labelledby="report-title">
      <div class="report-content" aria-live="polite"></div>
      <div class="report-actions"></div>
    </article>
  </main>
</body>
</html>
